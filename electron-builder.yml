appId: ai.cellar.desktop
productName: Cellar
directories:
  buildResources: build
  output: release/${version}
# electron-updater checks/downloads updates from here at runtime (GitHub Releases, no API key
# needed for a public repo). Publishing a release still requires `GH_TOKEN` in the environment
# that runs `electron-builder --publish always`; that's a CI/release-process secret, not this file.
publish:
  provider: github
  owner: Lazel-3002
  repo: Cellar
files:
  - out/**
  - package.json
  - resources/icon.png
  - '!**/*.map'
  # node-pty at runtime (win32-x64) needs only lib/, package.json and prebuilds/win32-x64:
  # conpty.node + conpty_console_list.node (ConPTY), pty.node + winpty.dll + winpty-agent.exe
  # (fallback before Windows build 18309) and conpty/{conpty.dll,OpenConsole.exe} (useConptyDll).
  - '!**/node_modules/node-pty/{deps,src,scripts,third_party,build,typings}/**'
  - '!**/node_modules/node-pty/prebuilds/{darwin-*,linux-*,win32-arm64}/**'
  - '!**/node_modules/node-pty/lib/*.test.js'
  - '!**/node_modules/node-pty/**/*.pdb'
  # Headers for building node-pty from source; never loaded at runtime.
  - '!**/node_modules/node-addon-api/**'
asarUnpack:
  # Native modules, helper executables and the conout worker script must be real files.
  - '**/node_modules/node-pty/**'
extraResources:
  - from: resources/artifact-runtime
    to: artifact-runtime
win:
  target:
    - target: nsis
      arch: [x64]
  executableName: Cellar
  # TODO(release): sign the build once a code-signing certificate is purchased from a CA, then
  # set `signtoolOptions` (or `certificateFile`/`certificateSubjectName`) here and flip this to
  # true so an unsigned build fails the release instead of shipping silently unsigned.
  forceCodeSigning: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: Cellar
  createDesktopShortcut: true
  # electron-updater's NSIS differential-update flow needs this even for unsigned builds.
  differentialPackage: true
npmRebuild: false
