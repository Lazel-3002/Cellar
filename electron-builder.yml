appId: ai.cellar.desktop
productName: Cellar
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - resources/icon.png
  - '!**/*.map'
extraResources:
  - from: resources/artifact-runtime
    to: artifact-runtime
win:
  target:
    - target: nsis
      arch: [x64]
  executableName: Cellar
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: Cellar
  createDesktopShortcut: true
npmRebuild: false
